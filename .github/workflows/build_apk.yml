name: Build Android APK Phieu Theo Doi

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Kiểm tra mã nguồn
        uses: actions/checkout@v4

      - name: ☕ Cài Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📦 Cài Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: 🔍 Kiểm tra phiên bản
        run: flutter --version

      - name: 🧹 Dọn dẹp
        run: flutter clean

      - name: 📚 Tải thư viện
        run: flutter pub get

      - name: ⚠️ Kiểm tra lỗi mã
        run: flutter analyze --no-fatal-infos

      - name: 🏗️ Build APK
        run: flutter build apk --release --no-shrink

      - name: 📤 Tải APK
        uses: actions/upload-artifact@v4
        with:
          name: UngDung_PhieuTheoDoi_PT78
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
